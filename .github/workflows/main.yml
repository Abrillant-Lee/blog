name: nan网站部署
on:
  push:
    branches:
      - main
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v3
      - name: install node
        uses: actions/setup-node@v4.0.1
        with:
          node-version: "21"
      - name: install deps
        run: npm install
      - name: build app
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          # personal_token: ${{ secrets.PERSONAL_TOKEN }}
          personal_token: ${{ secrets.TOKEN }}
          external_repository: Abrillant-Lee/Abrillant-Lee.github.io
          publish_branch: main  # default: gh-pages
          publish_dir: ./build
