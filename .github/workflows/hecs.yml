name: 打包Docusaurus项目

on: push # 当有内容push到仓库时触发

# 权限配置
permissions:
  contents: write
  pull-requests: write

jobs:
  pnpm-build:
    name: 项目部署到HECS服务器上
    runs-on: ubuntu-latest

    steps:
    - name: 读取仓库内容😁
      uses: actions/checkout@v4

    - name: 安装pnpm🤷‍♂️
      uses: pnpm/action-setup@v3.0.0
      with:
        version: 8.15.4

    - name: 安装依赖🚀
      run: pnpm install

    - name: 项目打包📦
      run: pnpm build

    - name: 复制打包好的文件到Nginx服务器😍
      uses: c0c1/scp-action@v1.0
      #uses: up9cloud/action-rsync@v1.4
      with:
        # Sorce dir to deploy
        src: "build/*"
        # SSH address
        host: ${{secrets.SERVER_HOST}}
        # Remote dir path
        remote: ${{secrets.SERVER_WORKDIR}}
        # SSH Port
        port: 22 # optional, default is 22
        # SSH User name
        user: ${{ secrets.SERVER_USERNAME}}
        # Private key
        key: ${{secrets.SSH_PRIVATE_KEY}}

    - name: 部署到GitHub上😍
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: main
        folder: build
